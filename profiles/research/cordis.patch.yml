# research profile — 领域 overlay（在 web 基础上叠加，行为与 web profile 一致）。
# base bundle 在上，本 overlay 追加 research 语义（按行 id 整行覆盖/插入）。
# 顶层必须是一个 loader patch 数组。
#
# 与 web profile 一致：
# - ui-settings-general：欢迎语版本（与 web 同款，避免旧缓存差异）
# - agent-preset-registry：新会话默认 preset 从 web 的 standard 切到 research
#   （Research Agent 本体；preset-research 定义见 bundle presets/research.patch.yml）
# - llm-pi-ai 提供 provider local-interval-dsv4（OpenAI 兼容，baseURL 本机内网网关），
#   key 通过 credential-ref LOCAL_INTERVAL_DSV4_API_KEY 从 $DSH_HOME/.credentials.yaml 解析
# - agent-default-model 把默认模型切到 dsv4flash；web 会话/agent-loop 不再走 base 默认
#   deepseek-official（其 DEEPSEEK_API_KEY 常为占位值「0731」会 401）
# - weknora 官方插件 @wxg-prc-cpg/dsh-weknora：本行覆盖插件自带 env 默认行，baseUrl 钉死
#   内网知识库、apiKey/tenantId 走环境变量（key 不进仓库）；插件未装时该行被静默丢弃
#   （非致命警告 entry not found），装上即生效 → 模板可长期保留（见 README「WeKnora」）
- id: connection
  name: '@deepseek-ai/dsh-client-connection'
  config:
    trustedHosts: !!js ctx.webStartup.trustedHosts
    cookieMaxAgeDays: 3650
- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-09-28.1
# 新会话默认用 Research Agent（而非 web 的 standard）。整层覆盖 base/web 的
# agent-preset-registry 行 config（web 定义只有 default 字段），default: research。
- id: agent-preset-registry
  name: "@deepseek-ai/dsh-agent-preset-registry"
  config:
    default: research
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      local-interval-dsv4:
        displayName: local-interval-dsv4
        apiKeyEnv: LOCAL_INTERVAL_DSV4_API_KEY
        api: openai-completions
        baseURL: http://10.2.165.201:8232/v1
        models:
          - id: dsv4flash
            name: dsv4flash
            contextWindow: 131072
            maxTokens: 32000
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: local-interval-dsv4
    model: dsv4flash


# weknora — WeKnora 知识库检索（Knowledge Plane）。baseUrl 已含 /api/v1（插件未含会自动补全）；
# knowledgeBaseIds 留空 = 自动解析凭据可见的全部知识库；resourceUrls: public = 引用给可加载直链
# （403 时插件自动退回 handle）；tenantId 仅平台级 key 需要（X-Tenant-ID 选工作空间）。
- id: weknora
  name: "@wxg-prc-cpg/dsh-weknora"
  config:
    baseUrl: http://10.2.165.201/api/v1
    apiKey: !!js process.env.WEKNORA_API_KEY
    tenantId: !!js process.env.WEKNORA_TENANT_ID
    knowledgeBaseIds: []
    resourceUrls: public
    toolPrefix: weknora
    tools:
      listKnowledgeBases: true
      search: true
      readDocument: true
      ask: true

# web search — 联网搜索改用插件 dsh-web-search-plugin（不再用 dsh 内置 web 搜索）。
# 插件 bundle 自带 patch 已完成三件事（本 profile 无需重复）：
#   - `web` 行覆盖：searchProvider=dsh-web-search（沿用 web_search 工具，底层换插件后端）
#   - `web-search-deepseek` 行禁用（dsh 内置 DeepSeek 官方搜索 host 插件下线，单一配置面）
#   - 插入 `dsh-web-search-plugin` 行（provider 默认 deepseek-official）
# 本行只显式声明该插件并钉死默认后端；9 个后端（DeepSeek 官方默认 / Tavily / Brave /
# Serper / SerpApi / Exa / SearXNG / Scavio / Firecrawl）在 Web UI 设置 → 网页搜索 卡片
# 运行时切换，无需重启插件或改 YAML；插件未装时本行被静默丢弃（非致命警告 entry not found），
# 装上即生效 → 模板可长期保留（见 README「联网搜索切换」）。
- id: dsh-web-search-plugin
  name: dsh-web-search-plugin
  config:
    provider: deepseek-official

# research-core 整行覆盖：开启五类记忆 + TRIZ 分析 note 的 JSON 落盘（默认全内存）。
# 阶段 10：统一 ArtifactStore 后 core.artifacts == memory.artifact.store_，persistMemory
# 落盘到 memory.dir（/profiles/research/memory）；research_triz / triz-auto 写入的
# TRIZ note 随会话一起持久化，重启后 loadMemoryInto 还原、右侧栏按 sessionId 过滤恢复。
- id: research-core
  name: '@basil/dsh-research'
  config:
    agents:
      enabled: true
    memory:
      dir: !!js dshHomePath('profiles/research/memory')

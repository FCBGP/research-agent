# reviewer profile — 领域 overlay（在 web 基础上叠加，行为与 web profile 一致）。
# base bundle 在上，本 overlay 追加 research 语义（按行 id 整行覆盖/插入）。
# 顶层必须是一个 loader patch 数组。
#
# 与 web profile 一致：
# - ui-settings-general：欢迎语版本（与 web 同款，避免旧缓存差异）
# - agent-preset-registry：新会话默认 preset 从 web 的 standard 切到 reviewer
#   （评审反证角色：Reviewer Agent；preset-reviewer 定义见 bundle presets/roles.patch.yml）
# - llm-pi-ai 提供 provider local-interval-dsv4（OpenAI 兼容，baseURL 本机内网网关），
#   key 通过 credential-ref LOCAL_INTERVAL_DSV4_API_KEY 从 $DSH_HOME/.credentials.yaml 解析
# - agent-default-model 把默认模型切到 dsv4flash；web 会话/agent-loop 不再走 base 默认
#   deepseek-official（其 DEEPSEEK_API_KEY 常为占位值「0731」会 401）
- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-09-28.1
# 新会话默认用 Reviewer Agent（research_review / research_verify，verdict 显式化；而非 web 的 standard）。整层覆盖 base/web 的
# agent-preset-registry 行 config（web 定义只有 default 字段），default: reviewer。
- id: agent-preset-registry
  name: "@deepseek-ai/dsh-agent-preset-registry"
  config:
    default: reviewer
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      local-interval-dsv4:
        displayName: local-interval-dsv4
        apiKeyEnv: LOCAL_INTERVAL_DSV4_API_KEY
        api: openai-completions
        baseURL: http://10.2.165.201:8232/v1
        models:
          - id: dsv4flash
            name: dsv4flash
            contextWindow: 131072
            maxTokens: 32000
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: local-interval-dsv4
    model: dsv4flash

# research-core 整行覆盖：开启五类记忆 + TRIZ 分析 note 的 JSON 落盘（默认全内存）。
# 阶段 10：统一 ArtifactStore 后 core.artifacts == memory.artifact.store_，persistMemory
# 落盘到 memory.dir（/profiles/reviewer/memory）；research_triz / triz-auto 写入的
# TRIZ note 随会话一起持久化，重启后 loadMemoryInto 还原、右侧栏按 sessionId 过滤恢复。
- id: research-core
  name: '@basil/dsh-research'
  config:
    agents:
      enabled: true
    memory:
      dir: !!js dshHomePath('profiles/reviewer/memory')

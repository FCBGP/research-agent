# cordis.patch.yml — @basil/dsh-research 的 host 平面分片（bundle insert 层，阶段 5）。
#
# 组合语义（见 dsh-app-boot/profile）：profile 的 dsh.profile.bundles 按序叠加
# 每个 bundle 的 patch 文件（本文件 + presets/research.patch.yml），最后再叠加
# profile 自己的 cordis.patch.yml。行 id 是寻址键：更高层 patch（profile overlay）
# 可对本行做整行覆盖/禁用。
#
# 阶段 5 把原先单行 dsh-research-core 巨型插件（11 服务 + 13 工具全在 host 平面）
# 拆为 7 个职责单一插件：
#   本文件 = host 平面 6 行（核心服务：core / triz / director / experiment / writer / operations）
#   presets/research.patch.yml = preset 平面（preset-research：research-tools + skill 挂载）
# research_* 工具不再 host 全局注册，只在 research/engineering 等预设会话可见（消除 always-on 污染）。
# 阶段 8 追加 research-triz（TRIZ 方法论服务：40 原理/39 参数/精选矩阵/IFR），供 research_triz 工具消费。
#
# host 行顺序 = 依赖顺序：research-core 最先（provides researchCore/Memory/Agents，
# 被 research-triz / research-director / research-experiment / research-writer / research-operations 消费），
# research-operations 最后（聚合 autonomous，经 writer/experiment/memory 组装）。
- insert:
    # research-core ── 核心数据模型（claim / verify / plan / artifact）+ 五类记忆
    # （semantic / episodic / artifact / hypothesis / evidence）+ 三角色 agent。
    # provides researchCore / researchMemory / researchAgents。
    # 承接原 dsh-research-core 行的记忆配置：config.memory.dir 开启记忆 JSON 落盘
    # （默认全内存），多轮/跨会话持久化需由 profile overlay 整行覆盖本行给出 dir。
    - id: research-core
      name: '@basil/dsh-research/core'
      config:
        agents:
          enabled: true
        # 记忆默认全内存；需要落盘时由 profile overlay 整行覆盖本行并给出 dir：
        # memory:
        #   dir: '$DSH_HOME/profiles/research/memory'

    # research-triz ── TRIZ 方法论服务（发明问题解决理论：假说生成 / 机制设计）。
    # provides researchTriz（analyzeProblem / idealityFraming / toHypotheses）。
    # 独立于其它 research-* 服务（知识基自带），defines 在 research-core 之后便于
    # plugin-tools 一并 ctx.get；消费方 = research_triz 工具 + skills/triz/SKILL.md。
    - id: research-triz
      name: '@basil/dsh-research/triz'

    # research-triz-ui ── Web 右侧栏「TRIZ 发明原理」面板的数据源（host 半边）。
    # 在 connection 鉴权栅栏内挂 /api/research.triz.notes GET route，从
    # researchCore.artifacts 过滤 research_triz 工具写入的 note，回填 40 原理明细
    # 供浏览器半边（client/index.ts + client/TrizTab.tsx）渲染。依赖 connection
    # （web 基座）+ researchCore（ctx.get 惰性读取）；不注册任何 research_* 工具。
    - id: research-triz-ui
      name: '@basil/dsh-research/triz-ui'

    # research-director ── 研究 DAG 调度（消费 core 的 memory/agents，按「依赖满足 +
    # 信息增益最高」分派任务）。provides researchDirector。
    - id: research-director
      name: '@basil/dsh-research/director'

    # research-experiment ── 自动实验战役（TopologyExecutor / RouteEngineSim +
    # 四口径统计 + runner 流水线）。provides researchExperiment。
    - id: research-experiment
      name: '@basil/dsh-research/experiment'

    # research-writer ── 论文 / 幻灯片产出（writer：paper + slides）。
    # provides researchWriter。
    - id: research-writer
      name: '@basil/dsh-research/writer'

    # research-operations ── 运维类服务：policy / autonomous / jobs / scheduler /
    # self-improve / real-subagent seam。
    # provides researchPolicy / researchAutonomous / researchJobs / researchScheduler /
    # researchSelfImprove / researchSubagents。
    # config 承接原 dsh-research-core 行的工具门与策略/子代理开关（默认全开）。
    - id: research-operations
      name: '@basil/dsh-research/operations'
      config:
        # 工具注册门：research_* 工具由 presets/research.patch.yml 的 research-tools
        # 行挂到 research 预设作用域（只进 research 会话工具目录）；设 false 则
        # 工具不注册、服务仍挂载（替换原 dsh-research-core 行的 tools.enabled）。
        tools:
          enabled: true
        # 10 条 Research Agent Policy（AGENTS.md §9）默认启用；可经 extra/omit 增删。
        policy:
          enabled: true
        # real-subagent 走 web 会话 seam（createDshSubagentSeam）；provider 默认
        # spawn，seam 不可用 / 无父 Agent 时自动本地回退。
        subagents:
          enabled: true
          provider: spawn

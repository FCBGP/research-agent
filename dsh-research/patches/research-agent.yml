# research-agent.yml — @basil/dsh-research 的 bundle insert 层。
#
# 组合语义（见 dsh-app-boot/profile）：profile 的 dsh.profile.bundles 按序叠加
# 每个 bundle 的 patch 文件（本文件），最后再叠加 profile 自己的 cordis.patch.yml。
# 行 id 是寻址键：更高层 patch（profile overlay）可对本行做整行覆盖/禁用。
#
# 本行把 dsh-research 插件挂到运行树：插件 main export 是 Cordis 形态
# (name + apply)，加载后会在 ctx 提供 researchCore / researchMemory /
# researchAgents / researchDirector 服务并注册 research_* 工具（阶段 2 共 5 个）。
- insert:
    - id: dsh-research-core
      name: '@basil/dsh-research'
      config:
        tools:
          enabled: true
        # 记忆默认全内存；需要落盘时由 profile overlay 整行覆盖本行并给出 dir：
        # memory:
        #   dir: '$DSH_HOME/profiles/research/memory'

# config.yaml — 本地科研智能体配置
# 优先级: 环境变量 > 本文件;per-call model 参数最高。
# 每个配置都写"是什么/干嘛的"。${VAR} 由同名环境变量填充。

# ----------------------------------------------------------------
# 连接(api):当前使用的供应商/端点/模型/温度
# ----------------------------------------------------------------
api:
  provider: local              # 当前供应商: openai|claude|gemini|deepseek|glm|kimi|relay|local
  base_url: "http://127.0.0.1:8080/v1"  # 当前供应商的 OpenAI 兼容端点地址(默认本地 omlx)
  api_key: "0731"              # 当前供应商的 API 密钥(本地默认)
  model: "DeepSeek-V4-Flash-0731-2.4bit-mixed"  # 当前底层模型名
  # model: "Qwen3.8-27B"  # 当前底层模型名
  temperature: 0.3             # 生成温度:越低越严谨,越高越发散

# ----------------------------------------------------------------
# 多角色模型(辩论/进化/研究各角色可配不同底层模型)
# 默认沿用 api.model;每角色可单独换模型
# ----------------------------------------------------------------
agent_models:
  proposer: "DeepSeek-V4-Flash-0731-2.4bit-mixed"   # 辩论中的提出方模型
  critic: "DeepSeek-V4-Flash-0731-2.4bit-mixed"     # 辩论中的批判方模型
  synthesizer: "DeepSeek-V4-Flash-0731-2.4bit-mixed" # 辩论/总结的合成方模型
  learner: "DeepSeek-V4-Flash-0731-2.4bit-mixed"   # 进化环的"学习"角色模型
  designer: "DeepSeek-V4-Flash-0731-2.4bit-mixed"  # 进化环的"设计"角色模型
  analyzer: "DeepSeek-V4-Flash-0731-2.4bit-mixed"  # 进化环的"分析"角色模型

# ----------------------------------------------------------------
# 供应商预设(快速切换 api.provider;${VAR} 由环境变量填充)
# 只有你设置对应环境变量时该供应商才可用
# ----------------------------------------------------------------
providers:
  openai:                      # 官方 OpenAI
    base_url: "https://api.openai.com/v1"
    api_key: "${OPENAI_API_KEY}"       # 需设 OPENAI_API_KEY 环境变量(付费)
    model: "gpt-4o"
  claude:                       # 官方 Anthropic Claude
    base_url: "https://api.anthropic.com/v1"
    api_key: "${ANTHROPIC_API_KEY}"   # 需设 ANTHROPIC_API_KEY(付费)
    model: "claude-3-5-sonnet"
  gemini:                       # 官方 Google Gemini(OpenAI 兼容端点)
    base_url: "https://generativelanguage.googleapis.com/v1beta/openai"
    api_key: "${GEMINI_API_KEY}"      # 需设 GEMINI_API_KEY(免费档可用)
    model: "gemini-1.5-pro"
  deepseek:                     # 官方 DeepSeek
    base_url: "https://api.deepseek.com/v1"
    api_key: "${DEEPSEEK_API_KEY}"    # 需设 DEEPSEEK_API_KEY(付费)
    model: "deepseek-chat"
  glm:                          # 智谱 GLM(OpenAI 兼容)
    base_url: "https://open.bigmodel.cn/api/paas/v4"
    api_key: "${GLM_API_KEY}"         # 需设 GLM_API_KEY(有免费档)
    model: "glm-4"
  kimi:                         # 月之暗面 Kimi(OpenAI 兼容)
    base_url: "https://api.moonshot.cn/v1"
    api_key: "${MOONSHOT_API_KEY}"    # 需设 MOONSHOT_API_KEY(有免费档)
    model: "kimi-k2"
  relay:                        # 中转站(任意 OpenAI 兼容聚合端点)
    base_url: "${RELAY_BASE_URL}"     # 需设 RELAY_BASE_URL(常需付费)
    api_key: "${RELAY_API_KEY}"       # 需设 RELAY_API_KEY
    model: "${RELAY_MODEL}"
  local:                        # 本地(ollama/vllm/任意本地 OpenAI 兼容)
    base_url: "http://127.0.0.1:8080/v1"
    api_key: "0731"
    model: "DeepSeek-V4-Flash-0731-2.4bit-mixed"
    # model: "Qwen3.8-27B"

# ----------------------------------------------------------------
# 辩论(多智能体反复讨论一个 idea 到定论)
# ----------------------------------------------------------------
debate:
  rounds: 3                    # 辩论轮数:每轮 proposer 提出→critic 批判→synthesizer 合成

# ----------------------------------------------------------------
# 进化环(ASI-Evolve 式:LEARN→DESIGN→EXPERIMENT→ANALYZE)
# ----------------------------------------------------------------
evolve:
  max_rounds: 3                # 每轮 LEARN→DESIGN→EXPERIMENT→ANALYZE 的最大轮数
  sample_best: true            # 每轮取样上一轮最佳节点(score 最高)引导本轮设计
  score_confidence: true       # 用置信度(高/中/低)给节点打分

# ----------------------------------------------------------------
# 工具调用循环上限与上下文预算
# ----------------------------------------------------------------
max_tool_turns: 12             # 单次研究的最大工具调用轮数(防止无限循环搜资料)
max_context_chars: 12000       # 每轮给模型的有界工作台字符预算(防止上下文爆掉)

# ----------------------------------------------------------------
# 输出目录
# ----------------------------------------------------------------
output_root: "output"          # 所有 agent 产物(报告/文档/图/笔记/DB)集中放的根目录

# ----------------------------------------------------------------
# 研究报告(完整长报告)配置
# ----------------------------------------------------------------
report:
  max_sections: 999            # 兜底大值:实际顶层章节由用户 prompt 规划(如 A-O 共15章),不设硬上限
  section_chars: 0             # 每章目标字数:0=不限制(段落错落有致,让模型自由写多长)
  min_section_chars: 300       # 每章最少字数下限(避免章节过短/空洞)
  max_section_chars: 3000      # 每章最多字数上限(防止单章过长失衡)
  chars_target: 0              # 全局目标 hanzi 字数:0=自然长度;>0 则分段生成到达标(用 scripts/chcount.py 数)
  min_report_chars: 0          # 报告最少 hanzi 下限(0=不强制;若 chars_target 未达,则至少到它)

# ----------------------------------------------------------------
# 联网搜索重试
# ----------------------------------------------------------------
web_search_retries: 3          # web_search 失败(超时/空结果/网络错误)时的重试次数(默认 3)
web_search_retry_delay: 2      # 每次重试之间等待的秒数(避免瞬时抖空打爆)

# ----------------------------------------------------------------
# prompt/模板目录(用户自有的完整研究 prompt / Word 模板库)
# ----------------------------------------------------------------
prompts_dir: "prompts"         # 用户放每次研究的完整 prompt 的目录(不上传 git)
templates_dir: "templates"     # 用户放 Word 参考模板 .docx 的目录(不上传 git)
